[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-video-agent"
version = "0.1.0"
description = "Local-first product demo analysis with inspectable artifacts"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.2,<2", "truststore>=0.10,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
video-agent = "video_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
video_agent = ["static/*.html", "static/*.css", "static/*.js"]
