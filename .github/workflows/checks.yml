name: Local tool checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.12', extras: dev}
          - {os: ubuntu-latest, python: '3.12', extras: 'dev,asr'}
          - {os: macos-14, python: '3.13', extras: dev}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -e '.[${{ matrix.extras }}]'
      - run: python -m pip check
      - run: video-agent doctor
      - run: ruff check src tests scripts skills/product-demo-editor/scripts
      - run: ruff format --check src tests scripts skills/product-demo-editor/scripts
      - run: pytest -q
      - run: python scripts/demo_agent.py --output work/ci-demo
      - run: python scripts/package_portfolio.py --output work/portfolio-source.zip
